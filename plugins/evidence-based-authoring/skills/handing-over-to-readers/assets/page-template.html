<title><!--TITLE--></title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column of one article; on an explanation the map of the page stands at its left, and the code or the
   source behind a reference opens in a panel at its right. The article is the body the builder joins in; its words
   come from the body and from DATA.strings, never from this file. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --ink: #15181d;
  --muted: #5a6370;
  --line: #d6dbe3;
  --accent: #2f4bd8;
  --accent-soft: #e4e9fb;
  --keep: #1c7a45;
  --keep-soft: #e1f3e8;
  --drop: #b3232c;
  --drop-soft: #fbe4e5;
  --tint: #e9ecf1;
  --lit: #fff0b3;        /* what the voice is speaking about: the one colour of the highlight */
  --lit-line: #d9a514;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-head: var(--font-text);
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --col: 76ch;
  --gutter: 20px;
  --map-w: 264px;        /* the map of the page */
  --ref-w: 380px;        /* the panel of a reference */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #101317; --surface: #181c22; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2c333d;
    --accent: #93a5ff; --accent-soft: #1f2748; --keep: #5cc48b; --keep-soft: #173324; --drop: #f07a81; --drop-soft: #3a1c20;
    --tint: #222831; --lit: #4d4012; --lit-line: #d6ad3a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #101317; --surface: #181c22; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2c333d;
  --accent: #93a5ff; --accent-soft: #1f2748; --keep: #5cc48b; --keep-soft: #173324; --drop: #f07a81; --drop-soft: #3a1c20;
  --tint: #222831; --lit: #4d4012; --lit-line: #d6ad3a;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 16.5px; line-height: 1.6;
  padding-block: 28px 96px;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
main { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3, h4 { font-family: var(--font-head); text-wrap: balance; line-height: 1.25; margin: 0; }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 700; }
h2 { font-size: 20px; font-weight: 600; }
h3 { font-size: 17.5px; font-weight: 600; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--tint); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; font-variant-ligatures: none; }
[hidden] { display: none !important; }  /* a class that sets display must not show a hidden element */
.muted { color: var(--muted); font-size: 14.5px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.linkbtn { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-variant-numeric: tabular-nums; }
.linkbtn:disabled { opacity: 0.5; cursor: default; }
.no-audio { color: var(--muted); font-size: 14px; }

/* the voice by part: a button at the end of each part's heading. Its words stand in data-label and show through
   ::after, so they never enter the heading's text, a selection of it or a comment's quote; its glyph is drawn here. */
.part-voice {
  display: inline-flex; align-items: center; gap: 7px; margin-left: 12px; vertical-align: 0.2em; font-family: var(--font-text);
  font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--accent); background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 11px 3px 9px; cursor: pointer; user-select: none; -webkit-user-select: none; white-space: nowrap;
}
.part-voice::before { content: ""; width: 0; height: 0; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.part-voice.is-playing::before { width: 8px; height: 10px; border: 0; border-left: 3px solid currentColor; border-right: 3px solid currentColor; }
.part-voice::after { content: attr(data-label); }
.part-voice.is-next { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.part-line { display: flex; }
.part-line .part-voice { margin-left: 0; }

/* the article */
.sheet {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 26px 28px;
  display: flex; flex-direction: column; gap: 16px; font-size: 15.5px; line-height: 1.6;
}
.sheet > p, .sheet > ul, .sheet > ol { max-width: var(--col); }
.sheet > h2 { margin-top: 12px; }
.sheet > :is(h1, h2, h3)[data-lit] { align-self: flex-start; }
.sheet ul, .sheet ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 5px; }
.sheet pre { margin: 0; overflow-x: auto; background: var(--tint); border-radius: 8px; padding: 12px 14px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; white-space: pre; font-variant-ligatures: none; }
.sheet pre code { background: none; padding: 0; font-size: inherit; overflow-wrap: normal; }
.ask { font-weight: 600; font-size: 16.5px; }

/* what the voice speaks about: one colour, nothing moves */
.s { border-radius: 3px; }
.sheet :where(.s, h1, h2, h3, h4, p, li, td, th, tr, span, code, small, figure, .option, .decision) { transition: background-color 0.15s, box-shadow 0.15s; }
.sheet :is(.s, h1, h2, h3, h4, p, li, td, th, tr, span, code, small).lit { background: var(--lit); box-shadow: 0 0 0 3px var(--lit); }
.sheet :is(figure, .option, .decision, .twocol).lit { box-shadow: 0 0 0 3px var(--lit-line); }

/* figures: each in its own frame, in the page's palette */
figure { margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
figcaption { color: var(--muted); font-size: 13.5px; }
.figscroll { overflow-x: auto; }
figure table { border-collapse: collapse; font-size: 14.5px; line-height: 1.45; font-variant-numeric: tabular-nums; min-width: 480px; }
figure th, figure td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
figure th { font-weight: 600; color: var(--muted); font-size: 13px; }
figure td.good { color: var(--keep); } figure td.bad { color: var(--drop); }
svg.fig { display: block; width: 100%; min-width: 620px; height: auto; font-family: var(--font-text); }
.fig text { fill: var(--ink); font-size: 14px; }
.fig text.mono { font-family: var(--font-mono); font-size: 12.5px; font-variant-ligatures: none; }
.fig text.small { font-size: 12.5px; }
.fig text.lane { font-size: 13px; font-weight: 600; fill: var(--muted); }
.fig text.dim { fill: var(--muted); }
.fig text.bad { fill: var(--drop); }
.fig text.good { fill: var(--keep); }
.fig .box { fill: var(--surface); stroke: var(--muted); stroke-width: 1.4; }
.fig .attempt { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.fig .pause { fill: var(--tint); stroke: var(--muted); stroke-width: 1.2; }
.fig .ok { fill: var(--keep-soft); stroke: var(--keep); stroke-width: 1.4; }
.fig .no { fill: var(--drop-soft); stroke: var(--drop); stroke-width: 1.4; }
.fig .codebg { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.fig .hl { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 3; }
.fig .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.fig .arrh { fill: var(--muted); }
.fig [data-lit].lit rect:not(.codebg):not(.hl):not(.ok):not(.no), .fig rect[data-lit].lit:not(.codebg):not(.hl):not(.ok):not(.no) { fill: var(--lit); stroke: var(--lit-line); stroke-width: 2.4; }
.fig [data-lit].lit rect.ok, .fig [data-lit].lit rect.no { stroke: var(--lit-line); stroke-width: 3.2; }  /* a verdict keeps its own fill while lit */
.fig [data-lit].lit .codebg { stroke: var(--lit-line); stroke-width: 2.4; }
.fig [data-lit].lit .arr { stroke: var(--lit-line); stroke-width: 2.4; }
.fig [data-lit].lit .arrh { fill: var(--lit-line); }
.fig [data-lit].lit text { font-weight: 600; }
.fig text[data-lit].lit { font-weight: 600; paint-order: stroke; stroke: var(--lit); stroke-width: 9px; stroke-linejoin: round; }

/* a switch: .seg[data-switch] toggles the class "safe" on its target */
.only-safe { display: none; }
.safe .only-safe { display: revert; }
.safe .only-now { display: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 0; padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--bg); font-weight: 600; }

/* a two-column list */
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 28px; }
.twocol ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.twocol li, .option li { padding-left: 1.3em; position: relative; }
.twocol li::before, .option li::before { position: absolute; left: 0; font-weight: 700; }
.twocol li.plus::before, .option li.plus::before { content: "+"; color: var(--keep); }
.twocol li.minus::before, .option li.minus::before { content: "\2212"; color: var(--drop); }

/* the decisions */
.decision { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; border-radius: 3px; }
.decision > h3 { align-self: flex-start; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.option { border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: box-shadow 0.15s; }
.option.chosen { border-color: var(--accent); background: var(--accent-soft); }
.option h4 { font-size: 16px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.option ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
.decision .why { color: var(--muted); font-size: 14px; }
.tag { font-family: var(--font-text); font-size: 12px; font-weight: 600; color: var(--keep); background: var(--keep-soft); border-radius: 999px; padding: 2px 9px; }
.choose { font: inherit; font-size: 13.5px; font-weight: 600; color: var(--accent); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; align-self: flex-start; margin-top: auto; }
.option.chosen .choose { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.decision label { font-size: 14px; color: var(--muted); }
textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; width: 100%; max-width: var(--col); min-height: 56px; resize: vertical;
}
/* the reader's words on a part: one row that grows with its text */
.part-words { display: flex; flex-direction: column; gap: 6px; max-width: var(--col); }
.part-words label { font-size: 14px; color: var(--muted); }
.part-words textarea { min-height: 0; resize: none; overflow: hidden; }
.answer-bar { display: flex; flex-direction: column; gap: 8px; max-width: var(--col); }
.answer-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.primary { font: inherit; font-weight: 600; color: var(--bg); background: var(--accent); border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
.primary:disabled { opacity: 0.5; cursor: default; }
.answer-note.bad { color: var(--drop); }
.answer-text { white-space: pre-wrap; user-select: all; font-family: var(--font-text); font-size: 14.5px; }

/* where to look */
.look { display: flex; flex-direction: column; gap: 10px; }
.sheet .look-list { list-style: none; padding: 0; gap: 8px; max-width: none; }
.look-item { border-top: 1px solid var(--line); padding-top: 8px; }
.look-item:first-child { border-top: 0; padding-top: 0; }
.look-item summary { cursor: pointer; }
.look-item details[open] summary { margin-bottom: 8px; }
.src .ln { color: var(--muted); user-select: none; }
.src .hit { background: var(--accent-soft); display: inline-block; min-width: 100%; }

/* a question after a part: its answer opens at the reader's click, his marks are his own, the parts he missed are listed */
figure.quiz { gap: 10px; }
details.q + details.q { border-top: 1px solid var(--line); padding-top: 10px; }
details.q > summary { cursor: pointer; font-weight: 600; }
details.q[open] > summary { margin-bottom: 8px; }
details.q > .answer { max-width: var(--col); }
.marks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.marks button { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
.marks button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.return-to { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; max-width: var(--col); }

/* the tools of a selection: two buttons above the selected text's first line, at its end, or under its last line */
main, .sheet { position: relative; }
.sel-tools {
  position: absolute; z-index: 7; display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 3px; box-shadow: 0 6px 16px -10px var(--ink); font-size: 13.5px;
}
.sel-tools button { font: inherit; font-weight: 600; color: var(--accent); background: none; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.sel-tools button:hover { background: var(--accent-soft); }
.sel-tools button:disabled { opacity: 0.5; cursor: default; background: none; }
.sel-said { color: var(--muted); font-size: 13px; padding-right: 6px; }
.sel-said:empty { display: none; }

/* a comment on a piece of the text: the window under the piece, the piece marked, the list before the answer bar */
.note-pop { position: absolute; z-index: 7; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 10px 24px -12px var(--ink); font-size: 14.5px; }
.note-pop textarea { min-height: 52px; max-width: none; }
.note-quote { display: block; font-size: 13.5px; color: var(--muted); }
.notes { display: flex; flex-direction: column; gap: 6px; max-width: var(--col); font-size: 14.5px; }
.sheet .notes ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 6px; }
.notes q { color: var(--muted); }
::highlight(note) { background-color: var(--accent-soft); text-decoration: underline; text-decoration-color: var(--accent); }
::highlight(note-draft) { background-color: var(--accent-soft); }
.s.noted { text-decoration: underline; text-decoration-color: var(--accent); }

/* the gist of a part: the few sentences to keep, set apart by a rule at their side on a tinted ground */
.gist { max-width: var(--col); display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; padding: 12px 16px; }
.sheet .gist ul, .sheet .gist ol { gap: 4px; }
/* a worked case, one block a step: side by side where they fit, stacked in a narrow window */
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.step { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 12px 14px; }
/* the method that carries out a line of the pseudocode, at the right edge of the line */
figure.pseudo pre .by { float: right; margin-left: 3ch; color: var(--muted); }

/* the map of the page: beside the text from 840 px, pushing it; over the text below that; its toggle at the top left */
.has-map { scroll-padding-top: 64px; }
.has-map body { padding-top: 64px; }
.map-beside body { padding-left: calc(var(--map-w) + max(var(--gutter), env(safe-area-inset-left, 0px))); }
.map-toggle {
  position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); z-index: 9;
  display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--accent);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; box-shadow: 0 4px 12px -8px var(--ink);
}
.map-toggle::before { content: ""; width: 14px; height: 10px; border-top: 2px solid currentColor; border-bottom: 2px solid currentColor;
  background: linear-gradient(currentColor, currentColor) center / 100% 2px no-repeat; }
.page-map {
  position: fixed; top: 0; bottom: 0; left: 0; z-index: 8; width: var(--map-w); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-right: 1px solid var(--line); padding: 60px 10px 24px 12px; font-size: 14px; line-height: 1.4;
  display: flex; flex-direction: column; gap: 10px;
}
.page-map:not([hidden]) { animation: map-in 0.18s ease-out; }
@keyframes map-in { from { transform: translateX(-100%); } to { transform: none; } }
.map-filter { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.map-filter input { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; }
.map-parts, .map-entries { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.map-entries { padding: 2px 0 6px 26px; }
.map-head { display: flex; align-items: flex-start; gap: 2px; }
.map-disclose { flex: none; width: 24px; height: 28px; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 0; }
.map-disclose::before { content: ""; width: 6px; height: 6px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg); }
.map-disclose[aria-expanded="true"]::before { transform: rotate(45deg); }
.map-disclose.is-empty { visibility: hidden; }
.map-part, .map-entries a { display: block; width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-radius: 6px; padding: 4px 8px; cursor: pointer; text-decoration: none; }
.map-part { font-weight: 600; }
.map-part:hover, .map-entries a:hover { background: var(--tint); }
.map-kind { display: block; font-size: 12px; color: var(--muted); }
.page-map [aria-current="location"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
@media (max-width: 839.98px) {
  .page-map { width: min(300px, 86vw); box-shadow: 0 10px 30px -12px var(--ink); }
}

/* references in place: a name of the code or of a source previews what it names and opens it in a panel */
.ref { text-decoration: underline dotted; text-decoration-color: var(--accent); text-underline-offset: 3px; cursor: pointer; }
.ref-pop {
  position: absolute; z-index: 7; max-width: min(560px, calc(100% - 16px)); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; box-shadow: 0 10px 24px -12px var(--ink); font-size: 13.5px; display: flex; flex-direction: column; gap: 6px;
}
.ref-pop pre, .ref-panel pre { margin: 0; overflow-x: auto; background: var(--tint); border-radius: 6px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; white-space: pre; font-variant-ligatures: none; }
.ref-panel {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 8; width: var(--ref-w); overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-left: 1px solid var(--line); padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px;
}
.ref-panel h2 { font-size: 17px; }
.ref-panel h2:focus { outline: none; }
.ref-panel .ref-close { align-self: flex-end; }
.ref-beside body { padding-right: calc(var(--ref-w) + max(var(--gutter), env(safe-area-inset-right, 0px))); }
html:not(.ref-beside) .ref-panel { box-shadow: 0 10px 30px -12px var(--ink); }
@media (max-width: 839.98px) {
  .ref-panel { width: min(420px, 92vw); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

<main>
  <audio id="voice" preload="metadata" hidden></audio>
  <p class="no-audio" id="no-audio" data-string="noAudio" hidden></p>
  <article class="sheet" id="article">
<!--BODY-->
  </article>
</main>

<script type="application/json" id="page-data">/*DATA*/</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("page-data").textContent);
  var S = DATA.strings, ID = DATA.id, CUES = DATA.cues, PARTS = DATA.parts;
  var LEAD = 0.08;     /* seconds: a cue counts as spoken this long before its start, as the voice reaches it between frames */
  var BEFORE = 0.05;   /* seconds: a jump to a sentence lands this long before its start, so its first sound is heard whole */
  var article = document.getElementById("article"), main = document.querySelector("main");
  var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* From this width the map and the panel of a reference stand beside the text and push it; below it they lie over it. */

      var r = e.getBoundingClientRect(), box = main.getBoundingClientRect(), width = preview.offsetWidth, height = preview.offsetHeight;
      var below = r.bottom + TOOLS_GAP + height <= window.innerHeight || r.top - TOOLS_GAP - height < 0;
      preview.style.left = Math.round(Math.max(8, Math.min(r.left - box.left, box.width - width - 8))) + "px";
      preview.style.top = Math.round((below ? r.bottom + TOOLS_GAP : r.top - TOOLS_GAP - height) - box.top) + "px";
    }
    function showPreview(e) {
      clearTimeout(hideTimer);
      if (previewOwner === e) { return; }
      hidePreview();
      var entry = entryOf(e);
      preview.textContent = "";
      if (entry.kind === "code") {
        preview.appendChild(place(entry));
        preview.appendChild(codeLines(entry.excerpt.slice(0, PREVIEW_LINES)));
      } else {
        preview.appendChild(el("strong", "", entry.title));
        if (entry.note) { preview.appendChild(el("p", "", entry.note)); }
      }

      e.setAttribute("aria-describedby", preview.id);

      if (owner && owner !== e) { owner.setAttribute("aria-expanded", "false"); }

      close.addEventListener("click", function () { closePanel(); });
      heading.tabIndex = -1;
      panel.textContent = "";
      panel.appendChild(close);
      panel.appendChild(heading);
      if (entry.kind === "code") {
        panel.appendChild(place(entry));
        panel.appendChild(codeLines(entry.excerpt));
        if (entry.editor) { panel.appendChild(link(entry.editor, S.refEditor, false)); }
      } else {
        panel.appendChild(el("p", "", entry.title));
        if (entry.note) { panel.appendChild(el("p", "muted", entry.note)); }
        panel.appendChild(link(entry.href, S.refSource, true));
      }
      owner = e;
      e.setAttribute("aria-expanded", "true");

    function closePanel() {

      owner = null;
      e.setAttribute("aria-expanded", "false");
      keepPlace(function () { panel.hidden = true; root.classList.remove("ref-beside"); }, e);

    }
    preview.id = "ref-pop";
    preview.setAttribute("role", "tooltip");
    preview.hidden = true;
    main.appendChild(preview);
    panel.id = "ref-panel";
    panel.setAttribute("aria-label", S.refPanel);
    panel.hidden = true;

      e.tabIndex = 0;
      e.setAttribute("role", "button");
      e.setAttribute("aria-expanded", "false");

      e.addEventListener("blur", function () { if (previewOwner === e) { hidePreview(); } });

      e.addEventListener("keydown", function (ev) {

  /* ---------- the reader's hand on the story: a click on a commented piece reopens its comment, Space pauses and resumes ---------- */
  var NOT_STORY = "a, button, textarea, input, select, summary, label, audio, [role=button], .decision, .look, .part-words, .answer-bar, .notes, .return-to";
  article.addEventListener("click", function (e) {
    if (draft || !e.target.closest || e.target.closest(NOT_STORY) || selecting()) { return; }
    var hit = noteAt(e.clientX, e.clientY);

  });
  /* Space is the browser's until the reader has started the voice once; from then on it pauses and resumes the voice. */
  document.addEventListener("keydown", function (e) {

    if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing || e.repeat) { return; }

    if (!acted && !tools.hidden) { hideTools(); acted = true; }
    if (!acted && pageMap) { acted = pageMap.escape(); }
    if (acted) { e.preventDefault(); }
  });

  restore(answer);
  try {
    var use = window.claude && window.claude.use ? window.claude.use("db") : null;
    Promise.resolve(use).then(function (store) {
      db = store || null;
      if (!db) { return null; }
      return db.doc("answers/" + ID).get().then(function (snap) {
        var stored = snap && snap.exists ? normal(snap.data()) : null;
        if (stored && stored.savedAt > answer.savedAt) { restore(stored); writeLocal(stored); }
      });
    }).catch(function () { db = null; /* the answer still copies and stays in localStorage without the store */ });
  } catch (e) { db = null; /* no store on this page */ }
})();
